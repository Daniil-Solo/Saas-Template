name: backend

x-app-common: &app-common
  build:
    context: .
    dockerfile: dev.Dockerfile
  env_file:
    - .env
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    # s3:
    #   condition: service_healthy
    redis:
      condition: service_healthy

x-after-migrate: &after-migrate
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  # Одноразовая задача: применяет миграции перед запуском app и worker.
  # Ручной запуск: docker compose -f dev.docker-compose.yml run --rm migrate
  migrate:
    <<: *app-common
    restart: "no"
    command: alembic upgrade head

  app:
    <<: *app-common
    depends_on: *after-migrate
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      default:
      shared:
        # frontend и другие проекты обращаются к API по адресу http://backend:8000
        aliases:
          - backend
    command: uvicorn src.interfaces.api.app:app --host 0.0.0.0 --port 8000 --no-access-log --reload

  # Фоновый воркер arq (письма и др.). Поднимается вместе с app
  worker:
    <<: *app-common
    depends_on: *after-migrate
    restart: unless-stopped
    command: arq src.interfaces.tasks.worker.WorkerSettings --watch src

  # Необязательно: SMTP-ловушка для проверки EMAIL_BACKEND=smtp. UI: http://localhost:8025, SMTP: mailpit:1025 в сети compose
  # Запуск: docker compose --profile mail up -d mailpit
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  # Тесты. Запуск: docker compose -f dev.docker-compose.yml run --rm tests [аргументы pytest]
  # Тестовая БД создается и удаляется самими тестами (conftest.py) на сервере db, основная БД не затрагивается
  tests:
    <<: *app-common
    profiles: ["tests"]
    restart: "no"
    command: pytest

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Временно отключено: образ minio/minio недоступен для скачивания
  # s3:
  #   image: minio/minio:RELEASE.2025-04-22T22-12-26Z
  #   command: server --console-address ":9001" /data/
  #   environment:
  #     MINIO_ROOT_USER: ${S3_ACCESS_KEY}
  #     MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
  #   ports:
  #     - "127.0.0.1:9000:9000"
  #     - "127.0.0.1:9001:9001"
  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    environment:
      TZ: UTC
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Метрики backend. UI: http://localhost:9090. Конфиг и дашборды - в ../observability
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../.infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  # Графики. UI: http://localhost:3000, порт меняется GRAFANA_PORT (логин и пароль - GF_SECURITY_ADMIN_USER и GF_SECURITY_ADMIN_PASSWORD, по умолчанию admin/admin)
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../.infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../.infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  # Общая сеть для связи с контейнерами из других compose-проектов (например, frontend).
  # Создается один раз: docker network create dev-network
  shared:
    name: dev-network
    external: true

volumes:
  postgres_data:
  minio_data:
  redis_data:
  prometheus_data:
  grafana_data:
