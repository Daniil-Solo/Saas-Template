# Prod: Prometheus опрашивает backend по имени сервиса api во внутренней сети monitoring (prod.docker-compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /api/internal/metrics
    static_configs:
      - targets: ["api:8000"]
