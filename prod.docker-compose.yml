name: app

# Production-развертывание на одном сервере. Запуск из корня репозитория:
#   cp .example.env .env   # заполнить все значения
#   docker compose up -d --build
#
# Безопасность:
# - на хосте опубликованы только порты 80 и 443 сервиса caddy, все остальное доступно лишь внутри docker-сетей;
# - сеть data (internal) не имеет выхода в интернет и подключена только к сервисам, которым нужны db, redis, s3;
# - сеть monitoring (internal) связывает api, prometheus и grafana; наружу grafana выходит только через caddy (grafana.DOMAIN);
# - контейнеры работают без root-прав, с отброшенными capabilities и read-only файловой системой;
# - обязательные секреты не имеют значений по умолчанию: без них compose не запустится.

x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-backend-common: &backend-common
  <<: *hardened
  build:
    context: ./backend
    dockerfile: prod.Dockerfile
  env_file:
    - .env
  environment:
    # Публичный адрес для ссылок в письмах
    APP_BASE_URL: https://${DOMAIN:?укажите DOMAIN в .env}
  read_only: true
  tmpfs:
    - /tmp

services:
  caddy:
    <<: *hardened
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env}
    volumes:
      - ./.infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - edge
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
      grafana:
        condition: service_started

  web:
    <<: *hardened
    build:
      context: ./frontend
      dockerfile: prod.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-}
        VITE_APP_RELEASE: ${VITE_APP_RELEASE:-}
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - edge

  api:
    <<: *backend-common
    command: uvicorn src.interfaces.api.app:app --host 0.0.0.0 --port 8000 --no-access-log --proxy-headers --forwarded-allow-ips="*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/internal/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
      - data
      - monitoring
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  # Фоновый воркер. Порты не публикует, ему нужен выход в интернет (внешние API), поэтому сеть edge
  worker:
    <<: *backend-common
    command: arq src.interfaces.tasks.worker.WorkerSettings
    networks:
      - edge
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  # Одноразовая задача: применяет миграции перед запуском api и worker
  migrate:
    <<: *backend-common
    restart: "no"
    command: alembic upgrade head
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *hardened
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # postgres при старте переключается на своего пользователя, поэтому нужны эти capabilities
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - data

  s3:
    <<: *hardened
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    # Консоль MinIO не включается и порты не публикуются
    command: server --console-address "127.0.0.1:9001" /data/
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  redis:
    <<: *hardened
    image: redis:7.2-alpine
    environment:
      TZ: UTC
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  # Метрики backend. Порты не публикуются, доступ только из сети monitoring (grafana)
  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./.infra/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  # Графики. Открывается снаружи только через caddy на grafana.DOMAIN, вход по логину и паролю
  grafana:
    <<: *hardened
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?укажите GRAFANA_ADMIN_USER в .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?укажите GRAFANA_ADMIN_PASSWORD в .env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN:?укажите DOMAIN в .env}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    user: "472:0"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./.infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./.infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - edge
      - monitoring
    depends_on:
      - prometheus

networks:
  # Сеть reverse proxy и сервисов, которым нужен доступ в интернет
  edge:
  # Изолированная сеть данных: без выхода наружу
  data:
    internal: true
  # Изолированная сеть мониторинга: api отдаёт метрики prometheus, grafana читает prometheus
  monitoring:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
  redis_data:
  prometheus_data:
  grafana_data:
